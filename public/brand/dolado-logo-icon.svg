<svg width="80" height="80" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="iconClip">
      <rect x="8" y="8" width="64" height="64" rx="16"/>
    </clipPath>
  </defs>

  <!-- Fundo do ícone: quadrado arredondado (radius 16), Brand Teal Wash -->
  <rect x="8" y="8" width="64" height="64" rx="16" fill="#E3F0EC"/>

  <g clip-path="url(#iconClip)">
    <!-- Figura A (Teal — DoLado): cabeça + corpo (avatar clássico) -->
    <circle cx="24" cy="36" r="7" fill="#0E6B5C"/>
    <circle cx="24" cy="66" r="15" fill="#0E6B5C"/>

    <!-- Figura B (Ink — cliente), encostada à Figura A -->
    <circle cx="56" cy="36" r="7" fill="#171A21"/>
    <circle cx="56" cy="66" r="15" fill="#171A21"/>
  </g>
</svg>
