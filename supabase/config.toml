project_id = "eqsmzczjyrcrsbfqioxt"

# verificar-monitor-datas é chamada pelo pg_cron via pg_net, não por
# um pedido autenticado com um JWT da Supabase — a autorização é feita pelo
# cabeçalho x-cron-secret verificado dentro da própria função.
[functions.verificar-monitor-datas]
verify_jwt = false

# novo-caso é chamada pelo trigger notificar_novo_caso (pg_net), sem JWT —
# a autorização é o cabeçalho x-webhook-secret, verificado na própria função.
[functions.novo-caso]
verify_jwt = false

# Limpeza diária de dossiês invocada pelo pg_net; valida x-cron-secret dentro
# da função, como os outros trabalhos agendados.
[functions.limpar-dossies-expirados]
verify_jwt = false

# E-mail "Confirm sign up" (confirmação do e-mail de uma conta nova).
# Fonte única do texto: supabase/templates/confirmacao.html. Tem sempre a
# ligação ({{ .ConfirmationURL }}, que volta a /auth/callback) e só mostra o
# código ({{ .Token }}) às contas criadas em "Tratar o meu caso" — a única
# página com campo para o introduzir (metadado mostrar_codigo, ver
# src/lib/authServidor.ts). /registo e /criar-conta recebem só a ligação.
# Este ficheiro só configura a stack local: em produção o mesmo assunto e
# HTML têm de ser colados no Dashboard (Authentication → Emails →
# Templates → Confirm sign up) sempre que o template mudar.
[auth.email.template.confirmation]
subject = "Confirme o seu e-mail na DoLado"
content_path = "./supabase/templates/confirmacao.html"

# E-mail "Reset password" (recuperação da palavra-passe, /recuperar-palavra-passe).
# Fonte única: supabase/templates/recuperacao.html. A ligação é
# {{ .RedirectTo }}?token_hash={{ .TokenHash }}, com RedirectTo =
# <NEXT_PUBLIC_SITE_URL>/redefinir-palavra-passe (enviado pelo servidor):
# abre a página da DoLado sem gastar o token (só o POST do formulário o
# valida) e funciona noutro dispositivo ou navegador — ao contrário do
# {{ .ConfirmationURL }} por omissão (fluxo PKCE, só no mesmo navegador).
# O URL tem de estar autorizado em Authentication → URL Configuration →
# Redirect URLs; se não estiver, a Supabase usa o "Site URL"
# (https://portal.dolado.pt) e o middleware encaminha ?token_hash= da raiz
# para /redefinir-palavra-passe.
# Em produção, colar o mesmo assunto e HTML no Dashboard (Authentication →
# Emails → Templates → Reset Password) sempre que o template mudar.
[auth.email.template.recovery]
subject = "Defina uma nova palavra-passe na DoLado"
content_path = "./supabase/templates/recuperacao.html"

# Stack local: os testes de contrato enviam vários e-mails da Auth (Mailpit)
# por execução; o limite local por omissão é 2 por hora.
[auth.rate_limit]
email_sent = 100
