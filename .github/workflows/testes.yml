# Testes em todos os PRs (e em main): TypeScript, lint, testes unitários e
# testes de contrato Stripe ↔ Supabase com a base de dados REAL (Supabase
# local em Docker, recriada a partir das migrations). Sem segredos: nada
# aqui fala com a Supabase de produção nem com o Stripe.
name: Testes

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unitarios:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Tipos globais gerados pelo Next (ex.: LayoutProps, em .next/types).
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test

  contrato:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - run: npm ci
      # Só a base de dados, a API (PostgREST), a Auth e o Mailpit (e-mails da
      # Auth, lidos pelo teste da recuperação da palavra-passe).
      - run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,realtime,postgres-meta
      # pgTAP (RLS, privilégios, funções SQL) primeiro, com a base acabada de
      # criar: rls_isolamento conta linhas e precisa da base vazia.
      - run: supabase test db
      - run: npm run test:contrato

  # O código do ramo base tem de funcionar sobre o esquema do PR: durante o
  # deploy (e depois de um revert) a versão anterior corre sobre as migrations
  # novas. Ver scripts/compatibilidade-esquema.mjs.
  compatibilidade-esquema:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      # Esquema NOVO: a stack local arranca com as migrations do PR.
      - run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,realtime,postgres-meta
      # Código ANTERIOR: o ramo base numa pasta à parte, com as suas dependências.
      - run: git worktree add base "origin/${{ github.base_ref }}"
      - run: npm ci
        working-directory: base
      - run: node scripts/compatibilidade-esquema.mjs base
        env:
          REF_BASE: origin/${{ github.base_ref }}
